name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      # Only whether the secrets exist; the values go to the wrangler step alone, never to npm install scripts.
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip when Cloudflare secrets are missing
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::Skipping deploy because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set."
      - if: env.HAS_SECRETS == 'true'
        uses: actions/checkout@v7
      - if: env.HAS_SECRETS == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_SECRETS == 'true'
        run: npm ci && npm run build
      - if: env.HAS_SECRETS == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
